<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ★ 2026-11-03（R8 整改①「程序页纵深只有一层」）：程序页自己的 CSP。
     改前：服务端模式的响应头只有 frame-ancestors，桌面壳模式（file://）连响应头都没有
     ⇒ 程序页防 XSS 只有 stemHtmlSafe 净化器一层，被绕过即得 window.ctbHost。
     现在 meta 与服务端 APP_CSP（src\tools\_服务端.mjs）逐字相同 —— 改一处必须同步另一处
     （tests\neg-server-csp.cjs 机读对拍钉住）。判据逐条说明见 _服务端.mjs 的 APP_CSP 注释。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; connect-src 'self' file:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>拾光小册</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- 应用骨架：由 js/shell.js 挂载（经典 script，兼容 file:// 直开） -->
<div id="boot" class="boot">
  <div class="boot-card">
    <div class="boot-logo" aria-hidden="true">拾</div>
    <div class="boot-t">拾光小册</div>
    <!-- ★ 2026-11-12（批次 3 / 可访问性）：启动状态是**会变的文本**，屏幕阅读器默认不会播报
         非聚焦区域的变化 ⇒ 加 role=status + aria-live=polite（礼貌播报，不打断用户当前朗读）。 -->
    <div class="boot-s" id="bootMsg" role="status" aria-live="polite">正在连接数据…</div>
    <div class="boot-bar" aria-hidden="true"><i></i></div>
  </div>
</div>
<div id="app" hidden>
  <aside id="sidebar"></aside>
  <div class="maincol">
    <header id="topbar"></header>
    <main id="view"></main>
    <footer id="statusbar"></footer>
  </div>
  <div id="drawerWrap" class="drawer-wrap" hidden>
    <div class="drawer-mask" id="drawerMask"></div>
    <section id="drawer" class="drawer"></section>
  </div>
  <div id="paletteWrap" class="palette-wrap" hidden>
    <div class="palette-mask" id="paletteMask"></div>
    <div class="palette"><input id="paletteInput" placeholder="搜索题目 / 输命令（&gt; 前缀执行命令）"><div id="paletteList" class="palette-list"></div></div>
  </div>
  <div id="lightbox" class="lightbox" hidden></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="printArea" class="print-area"></div>
</div>
<!-- 顺序装载（无构建依赖）：版本 → 工具 → 数据 → 渲染 → 视图 → 启动 -->
<!-- 版本.js 由打包脚本生成（注入 window.__GNOTE_VERSION__）；开发态没有它也无妨，必须排在
     js/version.js 之前 —— 后者只负责把它读进 CTB.version，自己不含版本号。 -->
<script src="版本.js"></script>
<script src="js/version.js"></script>
<script src="js/util.js"></script>
<script src="js/md.js"></script>
<script src="js/chart.js"></script>
<script src="js/host.js"></script>
<script src="js/model.js"></script>
<script src="js/shell.js"></script>
<script src="js/views/dash.js"></script>
<script src="js/views/bank.js"></script>
<script src="js/views/review.js"></script>
<script src="js/views/paper.js"></script>
<script src="js/views/pending.js"></script>
<script src="js/views/ingest.js"></script>
<script src="js/views/packs.js"></script>
<script src="js/views/stats.js"></script>
<script src="js/app.js"></script>
</body>
</html>
