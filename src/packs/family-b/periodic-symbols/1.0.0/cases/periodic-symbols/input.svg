<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#ffffff"/>
  <text x="300" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">合成案例 · 化学式书写（两小题共用一张化合价表）</text>
  <text x="300" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">本页为**合成素材**：题面、作答、批改痕迹均为虚构，不含任何真实学生信息。</text>

  <!-- 公共条件：本页只出现一次，且 (1)(2) 都要用 -->
  <rect x="40" y="88" width="520" height="150" fill="#f4f7fb" stroke="#4a7ebb"/>
  <text x="52" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2b4f7a">已知条件（本页通用）</text>
  <text x="52" y="134" font-family="monospace" font-size="12">常见化合价：Mg +2　Al +3　Cl -1　O -2　H +1</text>
  <text x="52" y="156" font-family="monospace" font-size="12">原子团：SO4 -2　OH -1　NO3 -1　CO3 -2　NH4 +1</text>
  <text x="52" y="178" font-family="monospace" font-size="12">相对原子质量：H 1　O 16　Mg 24　Al 27　S 32　Cl 35.5</text>
  <text x="52" y="200" font-family="monospace" font-size="12">书写要求：化学式按"正价在前、负价在后"写，并用下标标明原子个数</text>
  <text x="52" y="222" font-family="sans-serif" font-size="11" fill="#666">（这张表只在本页出现一次；第(1)(2)小题都要用它）</text>

  <!-- 第 1 小题：答对 -->
  <text x="40" y="280" font-family="sans-serif" font-size="14">(1) 写出氯化镁的化学式。</text>
  <text x="70" y="308" font-family="monospace" font-size="14">答：MgCl₂</text>
  <text x="200" y="308" font-family="sans-serif" font-size="14" fill="#2e7d32">✓</text>

  <!-- 第 2 小题：答错（错在没把 SO4 当整体、下标算错） -->
  <text x="40" y="370" font-family="sans-serif" font-size="14">(2) 写出硫酸铝的化学式。</text>
  <text x="70" y="398" font-family="monospace" font-size="14">答：AlSO₄</text>
  <line x1="70" y1="404" x2="150" y2="404" stroke="#999" stroke-width="1"/>
  <text x="86" y="428" font-family="sans-serif" font-size="14" fill="#c62828">✘</text>
  <text x="104" y="428" font-family="sans-serif" font-size="13" fill="#c62828">批改：错</text>
  <text x="180" y="428" font-family="sans-serif" font-size="11" fill="#888">（只画了叉，没写为什么错 —— 真实卷面的常态）</text>

  <text x="40" y="500" font-family="sans-serif" font-size="12" fill="#444">页脚：合成案例（批次 5 学科扩展示例）</text>
</svg>
