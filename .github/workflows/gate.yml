# 托管 CI：每次推送 / 每个 PR 跑"零依赖"那部分门禁
#
# 为什么只跑 fixture 档：
#   quick / full 需要**已构建的桌面壳 exe** 与**一个真实题库**，托管 runner 上都没有
#   （exe 要先联网拉 WebView2 再编壳，题库是用户私有数据）。fixture 档是专门为
#   "干净环境、无 exe、无真库"设计的，正好是 CI 能稳定跑的那一半。
#
# 为什么这条 CI 值得存在（而不是仪式）：
#   审计实测过两类缺陷**只在干净克隆里暴露、作者本机永远看不见**：
#   ① `*.ps1` 编码与 `.gitattributes` 冲突 → 新克隆拿到的脚本语法错（21+10 个解析错）；
#   ② `quick` 依赖真实题库的用例在无库环境下必红。
#   本机门禁管不了这两类，因为它们的前提是"干净环境"。
#
# 权限：只读。本工作流不写仓库、不评论、不用 secrets、不 checkout 不可信代码。

name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-dependency-gate:
    runs-on: windows-latest
    steps:
      # ★ 2026-11-17 升 v4 → v7：v4 跑在已被弃用的 Node 20 运行时上，GitHub 每次都
      #   强制用 Node 24 跑并告警（"Node.js 20 is deprecated"）。v7 的 action.yml 是
      #   `using: node24`，从根上消掉这条告警。
      #   破坏性变更核对（v5/v6/v7 三个大版本全读过）：
      #     · checkout v7：只影响 `pull_request_target` / `workflow_run` 的 fork 检出
      #       （默认改为拒绝不安全检出）。本工作流用 `pull_request`，不受影响。
      #     · setup-node v7：只影响自动缓存（ESM 迁移、cache 相关输出）。本工作流
      #       不跑 `npm ci`、不需要缓存，不受影响。
      #   两条都只动"用不到的那部分"，所以升版本是零行为变化。
      - uses: actions/checkout@v7

      # ★ 2026-11-17 换 Node 20 → 26：发行包内置的是 v26.10.0
      #   （`scripts\build-release.ps1` 的 `$PinnedNodeVersion`），本机开发也是 v26.10.0。
      #   改前 CI 装 Node 20 跑门禁 ⇒ **CI 绿不代表发行包能跑**：两边的 JS 引擎
      #   差的不是小版本（20 → 26 跨 6 个大版本），语法/内置 API/默认行为都有差异。
      #   门禁的意义是"干净环境下发行包能不能跑"，那它就该用发行包的那一版。
      #   ⚠ 版本号只写两处：这里 + build-release.ps1 的 $PinnedNodeVersion。
      #     改一处必须改另一处（`tests\portability.cjs` 会拦不一致）。
      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'

      - name: 语法 / 编码 / 行尾 / 调试残留
        run: node tools/lint.mjs

      - name: 零依赖自检（不需要 exe、不需要真实题库）
        run: node tests/run.mjs fixture

      - name: 可移植性（源码里有没有写死本机路径）
        # --allow-no-exe：干净克隆 / 托管 runner 上 src\app\拾光小册.exe 被 .gitignore 挡着，
        # 本来就不存在。不带这个参数时脚本会因缺 exe 判红（本机开发要的就是这个牙齿）；
        # 带上它，②③ 两段（查二进制）降级为可见的 SKIP，①「运行时代码零硬编码路径」与
        # ④（查 .cs 源码）照跑照判。不给成"缺 exe 就静默放行"，否则本机门禁会失去牙齿。
        run: node tests/portability.cjs --allow-no-exe

      - name: 干净树上这些 .ps1 必须能被 PowerShell 解析
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$err)
            if ($err.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::解析失败 $($err.Count) 处：$($err[0].Message)"
              $bad++
            }
          }
          if ($bad -gt 0) { throw "$bad 个 .ps1 解析失败（编码/行尾被检出环节破坏？见 CONTRIBUTING.md §五）" }
          Write-Host "全部 .ps1 解析通过"
