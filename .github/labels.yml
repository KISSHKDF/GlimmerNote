# 标签真源（≤10 个）
#
# 为什么把标签写进仓库：标签本来是**托管平台侧的对象**，不写下来的话
# "有哪些标签、一共几个"在仓库里查不到、也没法复现。这份文件是标签的唯一真源，
# 发布时按它建标签（见 scripts\setup-remote.ps1 的收尾清单）。
#
# 上限 10 个是刻意的：标签多了没人筛。要加先删。

- name: bug
  color: d73a4a
  description: 功能不对、报错、崩溃

- name: enhancement
  color: a2eeef
  description: 新功能或改进建议

- name: question
  color: d876e3
  description: 用法疑问（建议先看 README 的 FAQ）

- name: docs
  color: 0075ca
  description: 文档、注释、示例

- name: data
  color: fbca04
  description: 与题库数据/台账/作答契约相关

- name: print
  color: c5def5
  description: 组卷、打印、排版

- name: security
  color: b60205
  description: 安全问题（注意：请走私密渠道报告，不要在这里开公开 issue）

- name: duplicate
  color: cfd3d7
  description: 已有相同问题

- name: wontfix
  color: ffffff
  description: 明确不做（理由会写在 issue 里）

- name: blocked
  color: e99695
  description: 卡在外部条件上，暂时推不动
