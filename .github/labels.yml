# 标签真源（≤10 个）
#
# 为什么把标签写进仓库：标签本来是**托管平台侧的对象**，不写下来的话
# "有哪些标签、一共几个"在仓库里查不到、也没法复现。这份文件是标签的唯一真源，
# 发布时按它建标签（见 scripts\setup-remote.ps1 的收尾清单）。
#
# 上限 10 个是刻意的：标签多了没人筛。要加先删。
#
# ══ 「经验贡献四档状态」不在这里（2026-11-03 评估结论：**不能承载**）════════════════
# 申请的四档（建议书 §7 口径，逐字）：经验:试用中 / 经验:可用 / 经验:有争议 / 经验:已并入。
# 它们是**同一条经验的生命周期状态**（互斥，任何时刻只有一档），与下面这 10 个"分类"不同族。
# 为什么不做成标签（两条理由都可当场核对）：
#   ① 上限：本文件自己写着上限 10 个，而下面正好 10 个、**一个空位都没有**；四档加进来就是 14 个。
#   ② 腾位置得不偿失：要凑出 4 个空位，就得从 duplicate / wontfix / blocked / question 里删 4 个，
#      那是拿"issue 生命周期筛法"去换"经验状态"这一新维度，净损失。
# 替代载体（**正文口径的唯一真源是 CONTRIBUTING.md §八**，这里只登记结论与指针，不复述）：
#   状态写在 **Issue 标题前缀**上：[经验:试用中] → [经验:可用] / [经验:有争议] → [经验:已并入]，
#   四档互斥，由**维护者**改标题（提案人只提交第一档，见 experience 表单的 title 默认值）；
#   搜索等价写法：`in:title "[经验:可用]"`。代价如实写：① 不能点一下筛，要打搜索串；
#   ② 状态变了要改标题（时间线会多一条 edited）。表单因此只挂既有标签 enhancement，不新增标签。
# ⚠ 本结论的前提是"上限 10 且已用满"——前提一变（删了标签 / 抬了上限）必须重评：
#   tests\neg-contrib-templates.cjs 有前提断言，会在那种改动下当场红。
# ══════════════════════════════════════════════════════════════════════════════════

- name: bug
  color: d73a4a
  description: 功能不对、报错、崩溃

- name: enhancement
  color: a2eeef
  description: 新功能或改进建议

- name: question
  color: d876e3
  description: 用法疑问（建议先看 README 的 FAQ）

- name: docs
  color: 0075ca
  description: 文档、注释、示例

- name: data
  color: fbca04
  description: 与题库数据/台账/作答契约相关

- name: print
  color: c5def5
  description: 组卷、打印、排版

- name: security
  color: b60205
  description: 安全问题（注意：请走私密渠道报告，不要在这里开公开 issue）

- name: duplicate
  color: cfd3d7
  description: 已有相同问题

- name: wontfix
  color: ffffff
  description: 明确不做（理由会写在 issue 里）

- name: blocked
  color: e99695
  description: 卡在外部条件上，暂时推不动
