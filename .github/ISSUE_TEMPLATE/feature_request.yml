name: 功能需求
description: 提出一个新功能或改进建议（不是 BUG；安全问题请走 SECURITY.md 里的私密渠道）
title: "[需求] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢花时间写建议。动手填之前请先确认三件事：

        - 这是**完全离线的单机工具**：数据只存本机、不需要账号。云同步、多端协作、
          在线题库、账号体系这类需求与项目定位冲突，大概率不会被采纳。
        - 先搜一下现有 Issue，重复的建议会被合并。
        - **安全漏洞不要写在这里**，请按 `SECURITY.md` 里的私密渠道报告。

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 见 `VERSION.json` 的 `version`，或在程序「关于」里看
      placeholder: 2026.10.25.01
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 希望改进的区域
      description: 选一个最贴近的；不确定就选「其他」
      options:
        - 界面（面板 / 列表 / 详情 / 灯箱）
        - 题库数据（增删改 / 索引 / 台账）
        - 组卷 / 打印
        - 桌面壳（启动 / 关闭 / 托盘）
        - 打包 / 部署 / 回滚
        - 测试或门禁
        - 其他 / 不确定
    validations:
      required: false

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么事情的时候卡住了？请写具体的事，不要只写"希望更好用"
      placeholder: |
        例如：给两个孩子各出了一张卷，想对比谁的正确率更高，
        但现在只能一个个学生切着看，没法同屏对比。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你希望程序变成什么样？越具体越好（在哪个界面、点哪个按钮、出现什么）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你现在是怎么绕过去的？或者你考虑过但觉得不合适的做法。没有就写「无」
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 附加信息
      description: 截图、参考的其他软件、相关 Issue 链接等。**不要粘贴真实学生姓名等个人信息。**

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有找到相同的建议
          required: true
